<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de decisión</title>
<style>
:root{
  --crema:#FBF9F5;
  --terracota:#B85233;
  --terracota-osc:#8F3E24;
  --terracota-claro:#F8EAE4;
  --bosque:#4F6838;
  --bosque-osc:#3B4F29;
  --bosque-claro:#EEF2E8;
  --tinta:#2A2420;
  --suave:#6B6259;
  --borde:#E4DACB;
  --tarjeta:#FFFFFF;
  --neutro:#F3EFE8;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--crema);color:var(--tinta);
  font-family:Georgia,"Times New Roman",serif;line-height:1.65;
}
.barra{background:#F4EEE4;border-bottom:1px solid var(--borde)}
.barra .envoltura{padding:.6rem 1rem;font-size:.85rem;color:var(--suave)}
.envoltura{max-width:780px;margin:0 auto;padding:1.2rem 1rem 3rem}
.tarjeta{
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;
  padding:1.6rem 1.7rem;margin-bottom:1.2rem;
}
.tarjeta.decision{border-top:6px solid var(--terracota)}
.tarjeta.final{border-top:6px solid var(--bosque)}
.tarjeta.neutra{border-top:6px solid #A39A8E}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0 0 .6rem}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
h3{font-size:1.1rem;margin-top:1.6rem}
h1:focus,h2:focus{outline:none}
p{margin:.2rem 0 .9rem}
.etiqueta{font-weight:bold;font-size:.95rem;margin:0 0 .5rem}
.decision .etiqueta{color:var(--terracota-osc)}
.final .etiqueta{color:var(--bosque-osc)}
.neutra .etiqueta{color:var(--suave)}
.subtitulo{font-size:1.05rem;margin:1.2rem 0 .2rem;color:var(--terracota-osc)}
.situacion{font-size:1.15rem}
.foto{
  display:block;margin:.8rem 0;padding:.8rem 1rem;border:2px dashed #B9AE9F;
  background:#F7F2EA;border-radius:10px;font-style:italic;color:#5A5148;
}
.foto-img{display:block;margin:.8rem 0}
.foto-img img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--borde)}
.multimodal{display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:center;margin:0 0 .9rem}
.btn-voz{font:inherit;font-size:.95rem;padding:.4rem .9rem;min-height:40px;border-radius:999px;border:2px solid var(--suave);background:#fff;color:var(--tinta);cursor:pointer}
.btn-voz:hover{background:var(--neutro)}
.multimodal label{display:flex;gap:.4rem;align-items:center;margin:0;font-weight:normal;font-size:.95rem;color:var(--suave)}
.medio{display:block;width:100%;max-width:100%;margin:.6rem 0 1rem;border-radius:10px}
.foto-img img{cursor:zoom-in}
.visor{position:fixed;inset:0;z-index:50;background:rgba(42,36,32,.88);display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
.visor img{max-width:100%;max-height:100%;border-radius:8px}
.pie{max-width:780px;margin:0 auto;padding:0 1rem 1.6rem;font-size:.78rem;line-height:1.4;color:var(--suave);text-align:center}
.opciones{margin-top:1.2rem}
.opcion{
  display:flex;gap:.9rem;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:2px solid var(--terracota);border-radius:12px;
  padding:.9rem 1rem;margin:0 0 .75rem;min-height:56px;
  font:inherit;color:var(--tinta);cursor:pointer;
}
.opcion:hover{background:var(--terracota-claro)}
.opcion:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.letra{
  flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--terracota);
  color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,Arial,sans-serif;font-size:.95rem;margin-top:.1rem;
}
.btn{
  display:inline-block;border:none;border-radius:10px;padding:.85rem 1.7rem;min-height:48px;
  font:inherit;font-weight:bold;color:#fff;cursor:pointer;margin-top:.4rem;
}
.btn-terracota{background:var(--terracota)}
.btn-terracota:hover{background:var(--terracota-osc)}
.btn-bosque{background:var(--bosque)}
.btn-bosque:hover{background:var(--bosque-osc)}
.btn-borde{background:#fff;color:var(--bosque-osc);border:2px solid var(--bosque)}
.btn-borde:hover{background:var(--bosque-claro)}
label{display:block;font-weight:bold;margin:1.1rem 0 .3rem}
.req,.opc{font-weight:normal;color:var(--suave);font-size:.95rem}
input[type=text]{
  width:100%;font:inherit;padding:.75rem .9rem;border:2px solid #BDB2A2;border-radius:10px;
  background:#fff;color:var(--tinta);min-height:48px;
}
.error{color:#9B2C1A;font-weight:bold;margin:.8rem 0 0}
.consecuencia{
  background:var(--neutro);border-left:5px solid #A39A8E;border-radius:6px;
  padding:.9rem 1.1rem;margin:1rem 0 1.2rem;font-size:1.1rem;
}
.eleccion{color:var(--suave);font-size:.98rem}
.cierre{
  background:var(--bosque-claro);border-left:5px solid var(--bosque);border-radius:6px;
  padding:.9rem 1.1rem;margin:.4rem 0 1rem;
}
.alumno{margin:.2rem 0 0;color:var(--suave)}
table.vars{width:100%;border-collapse:collapse;margin:.4rem 0 .4rem}
table.vars th,table.vars td{padding:.55rem .4rem;border-bottom:1px solid var(--borde);text-align:left}
table.vars td{text-align:right;font-weight:bold;white-space:nowrap}
.nota{font-size:.92rem;color:var(--suave)}
ol.recorrido{list-style:none;margin:.6rem 0 0;padding:0 0 0 1.2rem;border-left:3px solid var(--bosque)}
ol.recorrido li{position:relative;padding:0 0 1.2rem 1rem}
ol.recorrido li::before{
  content:"";position:absolute;left:-1.62rem;top:.5rem;width:.9rem;height:.9rem;
  border-radius:50%;background:var(--terracota);border:2px solid var(--crema);
}
ol.recorrido li.fin::before{background:var(--bosque);width:1.05rem;height:1.05rem;left:-1.7rem}
.paso-id{font-weight:bold;color:var(--terracota-osc)}
.fin .paso-id{color:var(--bosque-osc)}
.paso-txt{font-size:.98rem;color:var(--suave);margin:.1rem 0 .3rem}
.paso-dec{margin:.1rem 0 .2rem}
.paso-cons{font-size:.95rem;color:var(--suave);margin:0}
.codigo{
  display:block;padding:.8rem 1rem;background:var(--neutro);border:1px solid var(--borde);
  border-radius:10px;font-family:Consolas,Menlo,"Courier New",monospace;font-size:.92rem;
  word-break:break-word;user-select:all;
}
.estado-copia{min-height:1.6rem;margin:.5rem 0 0;font-size:.95rem;color:var(--bosque-osc)}
.acciones{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
@media (max-width:520px){
  html{font-size:17px}
  .tarjeta{padding:1.2rem 1.1rem}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .opcion,.btn{transition:background-color .15s}
}
</style>
</head>
<body>
<div class="barra"><div class="envoltura" id="barraTitulo"></div></div>
<main class="envoltura" id="app">
  <noscript>Este simulador necesita JavaScript habilitado en el navegador.</noscript>
</main>
<footer class="pie">Las imágenes de este simulador fueron generadas con inteligencia artificial</footer>

    "N2":  { "tipo": "decision", "texto": "Muestra en el laboratorio. ¿Qué medios de cultivo sembrás?" },

    },
    "F6": {

    },
    "F7": {
      "tipo": "final",
      "titulo": "Ruta o muestra inadecuada",
      "texto": "Ruta o muestra inadecuada.",
      "cierre": "Una muestra de tanque mezcla leche de muchas vacas y no sirve para diagnosticar un cuarto individual. Las pruebas de enterobacterias (TSI, IMViC) corresponden a bacilos Gram negativos, y acá el Gram mostraba cocos Gram positivos. Revisá la relación entre morfología y prueba."
    }

  "opciones": [

      "destino": "N2", "efectos": [ {"var":"PR","op":"+","valor":1}, {"var":"PRES","op":"-","valor":0.5} ], "condicion": null,

    { "id": "N1-B", "nodo": "N1", "texto": "Ordeño directamente en un frasco, sin desinfectar el pezón.",

/* =====================================================================
   CASOS ALTERNATIVOS (mismo esqueleto: N1–N7 y F1–F7)
   El caso 1 es el original; los demás se arman con armarCaso().
   ===================================================================== */
const CASO1 = { id: "C1", ficha: DATOS.ficha, nodos: DATOS.nodos, opciones: DATOS.opciones };

function armarCaso(c) {
  const neg = c.gram === "neg", A = c.agente, B = CASO1.nodos;
  const ef = function (p, pres, t) {
    const r = [];
    if (p > 0) r.push({ var: "PR", op: "+", valor: p });
    if (p < 0) r.push({ var: "PR", op: "-", valor: -p });
    if (pres) r.push({ var: "PRES", op: "-", valor: pres });
    if (t) r.push({ var: "T", op: "+", valor: t });
    return r;
  };
  const cn = function (v) { return { var: "PRES", op: ">=", valor: v }; };
  const O = function (id, texto, destino, efectos, cond, cons) {
    return { id: id, nodo: id.split("-")[0], texto: texto, destino: destino, efectos: efectos, condicion: cond, consecuencia: cons || null };
  };
  const dec = function (t) { return { tipo: "decision", texto: t }; };
  const fin = function (t, x, k) { return { tipo: "final", titulo: t, texto: x, cierre: k }; };
  const ok = neg ? "Oxidasa" : "Catalasa";
  const mal = neg ? "Catalasa" : "Oxidasa";
  const malos = [
    ["Coagulasa en tubo", "Sin coágulo. La coagulasa sirve para diferenciar estafilococos."],
    neg ? ["CAMP test", "Sin reacción. El CAMP se usa para *Streptococcus agalactiae*."]
        : ["Citrato de Simmons", "Sin desarrollo. Es una prueba para bacilos Gram negativos."]
  ];

  const nodos = {
    N1: B.N1, N2: B.N2, N2B: B.N2B,
    N3: dec(c.n3),
    N3B: dec(neg ? "Catalasa: **positiva**, pero no ayuda a diferenciar bacilos Gram negativos. Perdiste tiempo y reactivo, y seguís sin saber el género. ¿Cómo seguís?" : B.N3B.texto),
    N4: dec(c.n4), N5: dec(c.n5),
    N6: dec("Identificación de trabajo: " + A + ". ¿Estudiás la sensibilidad a antimicrobianos?"),
    N7: dec(c.n7[0]),
    F1: fin("Diagnóstico completo y correcto", c.f1t, c.f1c),
    F2: fin("Falso negativo", "Informás cultivo negativo.", "Falso negativo. Un cultivo sin desarrollo en un solo medio no descarta infección: antes de informar negativo hay que resembrar en agar sangre. Mientras tanto, la vaca sigue eliminando bacterias y contagiando."),
    F3: fin("Informe incompleto", "Informe sin identificación completa o sin perfil de sensibilidad.", "Tratar sin identificar o identificar sin antibiograma deja al clínico a ciegas. Completá la secuencia: identificación y sensibilidad."),
    F4: fin("Diagnóstico correcto con muestra cuestionable", "Informás " + A + ", pero pedís nueva muestra.", B.F4.cierre),
    F5: fin("Error de interpretación terapéutica", "Recomendación terapéutica equivocada.", c.f5c),
    F6: B.F6,
    F7: fin("Ruta o muestra inadecuada", "Ruta o muestra inadecuada.", "Una muestra de tanque mezcla leche de muchas vacas y no sirve para diagnosticar un cuarto individual. Además, cada prueba debe elegirse según la morfología del Gram: revisá esa relación.")
  };

  const base = CASO1.opciones.filter(function (o) { return o.nodo === "N1" || o.nodo === "N2B"; });
  const n2 = CASO1.opciones.filter(function (o) { return o.nodo === "N2"; }).map(function (o) {
    const x = JSON.parse(JSON.stringify(o));
    if (neg && x.id === "N2-B") x.consecuencia = "Sembrado y en estufa. Ahorraste, pero sin MacConkey perdés información sobre la fermentación de lactosa.";
    if (neg && x.id === "N2-C") { x.destino = "N3"; x.efectos = ef(0.8, 0.75, 1); x.consecuencia = "Sembrado y en estufa. Crece, pero no ves la hemólisis."; }
    return x;
  });
  const resto = [
    O("N3-A", ok + ".", "N4", ef(1.5, 0.25), null, c.r3),
    O("N3-B", mal + ".", "N3B", ef(-0.5, 0.25), null, neg ? "Burbujeo inmediato: casi todos los bacilos Gram negativos la tienen y no ayuda a diferenciar." : "Reacción negativa: la oxidasa ayuda con bacilos Gram negativos."),
    O("N3-C", "Voy directo al antibiograma.", "F3", [], null, "Sin identificar, el informe queda incompleto."),
    O("N3B-A", "Hago la " + ok.toLowerCase() + ".", "N4", ef(1, 0.25), null, c.r3),
    O("N3B-B", neg ? "Paso a las pruebas de estafilococos (coagulasa, manitol salado)." : "Paso a pruebas de enterobacterias (TSI, IMViC).", "F7", [], null, neg ? "Esas pruebas no corresponden a bacilos Gram negativos." : "Esas pruebas no corresponden a cocos."),
    O("N4-A", c.n4a[0], "N5", ef(2, 0.75, 1), cn(0.75), c.n4a[1]),
    O("N4-B", malos[0][0] + ".", "N4", ef(-0.5, 0.5, 1), cn(0.5), malos[0][1]),
    O("N4-C", malos[1][0] + ".", "N4", ef(-0.5, 0.5, 1), cn(0.5), malos[1][1]),
    O("N5-A", c.n5a[0], "N6", ef(1.5, 1, 1), cn(1), c.n5a[1]),
    O("N5-B", c.n5b, "N6", ef(0.5), null, "Avanzás más rápido, pero sin confirmación."),
    O("N6-A", "Antibiograma por difusión en agar (Mueller-Hinton).", "N7", ef(1.5, 2, 1), cn(2), "Discos colocados, a estufa."),
    O("N6-B", "Informo " + A + " sin antibiograma.", "F3", [], null),
    O("N7-A", c.n7[1], "F1", ef(1), { var: "CONT", op: "=", valor: "no" }),
    O("N7-B", "Informo " + A + " y pido nueva muestra: el crecimiento y la toma no son confiables.", "F4", ef(0.5), { var: "CONT", op: "=", valor: "si" }),
    O("N7-C", c.n7[2], "F5", ef(-1), null),
    O("N7-D", c.n7[3], "F5", ef(-1), null)
  ];
  return { id: c.id, ficha: { titulo: c.titulo, objetivo: CASO1.ficha.objetivo, rol: c.rol }, nodos: nodos, opciones: base.concat(n2, resto) };
}

/* =====================================================================
   MOTOR (lógica pura, sin acceso a la pantalla)
   ===================================================================== */
const Motor = {
  limitar(x) {
    const r = Math.round(x * 100) / 100;
    return Math.min(DATOS.limites.max, Math.max(DATOS.limites.min, r));
  },

  definicion(id) {
    return DATOS.variables.find(function (v) { return v.id === id; });
  },

  opcion(id) {
    return DATOS.opciones.find(function (o) { return o.id === id; });
  },

  variablesIniciales() {
    const vars = {};
    DATOS.variables.forEach(function (d) {
      vars[d.id] = d.tipo === "numerica" ? Motor.limitar(d.inicio) : d.inicio;
    });
    return vars;
  },

  nuevoEstado(nombre, legajo) {
    return { alumno: { nombre: nombre, legajo: legajo }, vars: Motor.variablesIniciales(), camino: [] };
  },

  cumple(cond, vars) {
    if (!cond) return true;
    const a = vars[cond.var];
    const b = cond.valor;
    switch (cond.op) {
      case "=":  return a === b;
      case "!=": return a !== b;
      case ">":  return a > b;
      case ">=": return a >= b;
      case "<":  return a < b;
      case "<=": return a <= b;
    }
    return false;
  },

  opcionesVisibles(nodoId, vars) {
    return DATOS.opciones.filter(function (o) {
      return o.nodo === nodoId && Motor.cumple(o.condicion, vars);
    });
  },

  aplicarEfectos(vars, efectos) {
    efectos.forEach(function (e) {
      const d = Motor.definicion(e.var);
      if (d.tipo === "booleana") {
        if (e.op === "=") vars[e.var] = e.valor;
        return;
      }
      let v = vars[e.var];
      if (e.op === "+") v += e.valor;
      else if (e.op === "-") v -= e.valor;
      else if (e.op === "=") v = e.valor;
      vars[e.var] = Motor.limitar(v);
    });
  },

  /* Si el destino es un nodo de decisión, las reglas globales pueden desviarlo. */
  resolverDestino(destino, vars) {
    if (DATOS.nodos[destino].tipo === "final") return destino;
    for (let i = 0; i < DATOS.reglasGlobales.length; i++) {
      const r = DATOS.reglasGlobales[i];
      if (Motor.cumple(r.si, vars)) return r.destino;
    }
    return destino;
  },

  /* Orden estricto: 1) efectos, 2) condición de destino, 3) (la vista muestra la consecuencia). */
  elegir(estado, opcion) {
    Motor.aplicarEfectos(estado.vars, opcion.efectos);
    const destino = Motor.resolverDestino(opcion.destino, estado.vars);
    estado.camino.push({ nodo: opcion.nodo, opcion: opcion.id, destino: destino });
    return destino;
  },

  activarCaso(caso) {
    DATOS.ficha = caso.ficha;
    DATOS.nodos = caso.nodos;
    DATOS.opciones = caso.opciones;
    DATOS.casoId = caso.id;
  },

  codigo(estado, finalId) {
    return DATOS.casoId + ": " + estado.camino.map(function (p) { return p.opcion; }).concat([finalId]).join(" > ");
  }
};

/* =====================================================================
   VISTA (pantallas)
   ===================================================================== */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* Texto con **negrita** y *cursiva*; lo que va entre [Foto: ...] se marca como espacio de imagen. */
function fmt(s, img) {
  let t = esc(s);
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*(.+?)\*/g, function (m, c) {
    if (c.indexOf("[Foto") !== 0) return "<em>" + c + "</em>";
    if (img) return '<span class="foto-img"><img src="' + esc(img) + '" alt="' + c + '"></span>';
    return '<span class="foto">' + c + "</span>";
  });
  return t;
}

      }).join("") + "</div></section>"

    if (DATOS.nodos[id].tipo === "final") this.pantallaFinal(id);
    else this.pantallaNodo(id);

    this.nodoActual = id;

    if (visibles.length === 0) {
      estado.camino.push({ nodo: id, opcion: null, destino: DATOS.sinOpcionesDestino });
      this.irA(DATOS.sinOpcionesDestino);
      return;

    else this.irA(destino);

        '<h2 id="foco" tabindex="-1" class="etiqueta">' + esc(U.consecuencia) + "</h2>" +

  pantallaFinal(id) {

        '<div class="acciones">' +
          '<button type="button" id="copiar" class="btn btn-bosque">' + esc(U.copiar) + "</button>" +
          '<button type="button" id="reiniciar" class="btn btn-borde">' + esc(U.reiniciar) + "</button>" +
        "</div>" +
        '<p id="estadoCopia" class="estado-copia" role="status"></p>' +
      "</section>"
    );

      self.copiar(codigo, document.getElementById("estadoCopia"));
    });
    document.getElementById("reiniciar").addEventListener("click", function () {
      self.estado = null;
      self.pantallaCasos();
    });
  },

  copiar(texto, salida) {
    const U = this.U;
    function ok() { salida.textContent = U.copiado; }
    function respaldo() {
      let copiado = false;
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { copiado = document.execCommand("copy"); } catch (e) { copiado = false; }
      document.body.removeChild(ta);
      salida.textContent = copiado ? U.copiado : U.copiaFallida;
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(ok, respaldo);
    } else {
      respaldo();
    }
  }
};

/* =====================================================================
   CAPA MULTIMODAL (no toca nodos, textos, variables ni reglas)
   - Lectura en voz alta de lo que se ve en pantalla (voz del dispositivo)
   - Imágenes ampliables, y audio/video opcionales por nodo (ver MEDIOS)
   ===================================================================== */
const Voz = {
  auto: false,
  ok: typeof window !== "undefined" && "speechSynthesis" in window,
  limpiar(t) { return t.replace(/\[Foto:\s*/g, "Imagen: ").replace(/[\]*]/g, "").replace(/\s+/g, " ").trim(); },
  partes(app) {
    const out = [];
    [".final h1", ".situacion", ".consecuencia", ".cierre"].forEach(function (c) {
      const e = app.querySelector(c);
      if (e) out.push(e.textContent);
    });
    Array.prototype.forEach.call(app.querySelectorAll(".opcion"), function (b) {
      out.push("Opción " + b.querySelector(".letra").textContent + ". " + b.lastElementChild.textContent);
    });
    return out.map(Voz.limpiar);
  },
  leer(app, alTerminar) {
    if (!Voz.ok) return;
    window.speechSynthesis.cancel();
    const voces = window.speechSynthesis.getVoices();
    const voz = voces.filter(function (v) { return /^es[-_]AR/i.test(v.lang); })[0] ||
                voces.filter(function (v) { return /^es/i.test(v.lang); })[0];
    const partes = Voz.partes(app);
    partes.forEach(function (t, i) {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = voz ? voz.lang : "es-AR";
      if (voz) u.voice = voz;
      u.rate = 0.95;
      if (i === partes.length - 1) u.onend = u.onerror = alTerminar;
      window.speechSynthesis.speak(u);
    });
  },
  parar() { if (Voz.ok) window.speechSynthesis.cancel(); }
};

const Multimodal = {
  enlazado: false,
  ampliar(img) {
    const d = document.createElement("div");
    d.className = "visor";
    d.setAttribute("role", "dialog");
    d.setAttribute("aria-label", img.alt);
    const i = document.createElement("img");
    i.src = img.src;
    i.alt = img.alt;
    d.appendChild(i);
    function cerrar() { document.removeEventListener("keydown", tecla); d.remove(); }
    function tecla(e) { if (e.key === "Escape") cerrar(); }
    d.addEventListener("click", cerrar);
    document.addEventListener("keydown", tecla);
    document.body.appendChild(d);
  },
  montar(vista) {
    const app = vista.app, card = app.querySelector(".tarjeta");
    if (!Multimodal.enlazado) {
      Multimodal.enlazado = true;
      app.addEventListener("click", function (e) {
        if (e.target.matches && e.target.matches(".foto-img img")) Multimodal.ampliar(e.target);
      });
      app.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target.matches && e.target.matches(".foto-img img")) Multimodal.ampliar(e.target);
      });
    }
    if (!card || app.querySelector("#formInicio") || app.querySelector("[data-i]")) return;

    Array.prototype.forEach.call(app.querySelectorAll(".foto-img img"), function (im) {
      im.setAttribute("tabindex", "0");
      im.setAttribute("title", "Ampliar imagen");
    });

    const sit = card.querySelector(".situacion");
    if (sit && card.querySelector(".opciones") && vista.nodoActual) {
      const k = DATOS.casoId + "-" + vista.nodoActual;
      const au = MEDIOS.audios[k], vi = MEDIOS.videos[k];
      if (vi) sit.insertAdjacentHTML("afterend", '<video class="medio" controls preload="metadata" src="' + esc(vi) + '"></video>');
      if (au) sit.insertAdjacentHTML("afterend", '<audio class="medio" controls preload="metadata" src="' + esc(au) + '"></audio>');
    }

    if (Voz.ok) {
      const barra = document.createElement("div");
      barra.className = "multimodal";
      barra.innerHTML = '<button type="button" class="btn-voz" id="vozBtn">Escuchar</button>' +
        '<label><input type="checkbox" id="vozAuto"' + (Voz.auto ? " checked" : "") + '> Lectura automática</label>';
      card.insertBefore(barra, card.children[1] || null);
      const btn = barra.querySelector("#vozBtn");
      function reponer() { btn.textContent = "Escuchar"; }
      btn.addEventListener("click", function () {
        if (window.speechSynthesis.speaking) { Voz.parar(); reponer(); }
        else { btn.textContent = "Detener"; Voz.leer(app, reponer); }
      });
      barra.querySelector("#vozAuto").addEventListener("change", function (e) { Voz.auto = e.target.checked; });
      if (Voz.auto) { btn.textContent = "Detener"; Voz.leer(app, reponer); }
    }
  }
};

(function () {
  const pintarOriginal = Vista.pintar;
  Vista.pintar = function (html) {
    Voz.parar();
    pintarOriginal.call(this, html);
    Multimodal.montar(this);
  };
})();

/* =====================================================================
   REGISTRO (envío al Google Forms configurado en FORMULARIO)
   ===================================================================== */
const Registro = {
  activo() { return !!FORMULARIO.url; },
  datos(estado, id) {
    const c = FORMULARIO.campos, d = {};
    function poner(k, v) { if (c[k]) d[c[k]] = String(v); }
    poner("nombre", estado.alumno.nombre);
    poner("legajo", estado.alumno.legajo || "");
    poner("caso", DATOS.casoId);
    poner("final", id + ": " + DATOS.nodos[id].titulo);
    poner("codigo", Motor.codigo(estado, id));
    DATOS.variables.forEach(function (v) { poner(v.id, estado.vars[v.id]); });
    return d;
  },
  enviar(vista, id) {
    if (!Registro.activo()) return;
    const ref = document.getElementById("estadoCopia");
    if (!ref) return;
    ref.insertAdjacentHTML("afterend", '<p id="estadoRegistro" class="estado-copia" role="status"></p>');
    const salida = document.getElementById("estadoRegistro");
    const cuerpo = new URLSearchParams(Registro.datos(vista.estado, id));
    function intentar() {
      salida.textContent = "Enviando registro…";
      fetch(FORMULARIO.url, { method: "POST", mode: "no-cors", body: cuerpo }).then(function () {
        salida.textContent = "Registro enviado a la cátedra.";
      }, function () {
        salida.innerHTML = 'No se pudo enviar el registro (¿sin conexión?). Copiá el código de recorrido y entregalo a tu docente. ' +
          '<button type="button" class="btn-voz" id="reintentar">Reintentar</button>';
        document.getElementById("reintentar").addEventListener("click", intentar);
      });
    }
    intentar();
  }
};

(function () {
  const finalOriginal = Vista.pantallaFinal;
  Vista.pantallaFinal = function (id) {
    finalOriginal.call(this, id);
    Registro.enviar(this, id);
  };
  const inicioOriginal = Vista.pantallaInicio;
  Vista.pantallaInicio = function () {
    inicioOriginal.call(this);
    const f = document.getElementById("formInicio");
    if (Registro.activo() && FORMULARIO.aviso && f) {
      f.querySelector("button[type=submit]").insertAdjacentHTML("beforebegin", '<p class="nota">' + esc(FORMULARIO.aviso) + "</p>");
    }
  };
})();

if (typeof document !== "undefined" && document.getElementById("app")) {
  Vista.iniciar();
}
</script>
